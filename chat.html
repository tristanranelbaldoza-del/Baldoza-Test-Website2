<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Assistant — Tester.io</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Montserrat', sans-serif;
      background: #0d0804;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Navbar ── */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 50;
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(13,8,4,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(232,93,4,0.12);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .logo img { height: 28px; }
    .logo span {
      font-size: 17px;
      font-weight: 700;
      background: linear-gradient(90deg, #f48c06, #e85d04);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .back-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255,255,255,0.65);
      text-decoration: none;
      padding: 6px 14px;
      border: 1px solid rgba(232,93,4,0.25);
      border-radius: 8px;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }
    .back-btn:hover {
      color: #f48c06;
      border-color: rgba(232,93,4,0.55);
      background: rgba(232,93,4,0.07);
    }
    .back-btn svg { width: 14px; height: 14px; }

    /* ── Chat layout ── */
    .chat-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 780px;
      width: 100%;
      margin: 0 auto;
      padding: 80px 16px 20px;
    }

    /* ── Message list ── */
    .messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 20px 0 10px;
      scrollbar-width: thin;
      scrollbar-color: #333 transparent;
    }
    .messages::-webkit-scrollbar { width: 5px; }
    .messages::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 12px;
      padding: 60px 20px;
    }
    .empty-state .flame {
      font-size: 48px;
      filter: drop-shadow(0 0 16px rgba(232,93,4,0.6));
      animation: pulse 2.5s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.1);} }
    .empty-state h2 {
      font-size: 26px;
      font-weight: 700;
      background: linear-gradient(90deg, #f48c06, #e85d04);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .empty-state p { font-size: 14px; color: rgba(255,255,255,0.45); max-width: 380px; line-height: 1.6; }

    /* Message bubbles */
    .msg { display: flex; gap: 10px; align-items: flex-start; }
    .msg.user { flex-direction: row-reverse; }
    .msg-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700;
    }
    .msg.user .msg-avatar { background: linear-gradient(135deg, #e85d04, #f48c06); color: #fff; }
    .msg.ai .msg-avatar { background: rgba(232,93,4,0.15); border: 1px solid rgba(232,93,4,0.3); color: #f48c06; font-size: 16px; }
    .msg-bubble {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.6;
    }
    .msg.user .msg-bubble {
      background: linear-gradient(135deg, rgba(232,93,4,0.18), rgba(193,68,14,0.12));
      border: 1px solid rgba(232,93,4,0.25);
      color: rgba(255,255,255,0.92);
      border-bottom-right-radius: 4px;
    }
    .msg.ai .msg-bubble {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      color: rgba(255,255,255,0.85);
      border-bottom-left-radius: 4px;
    }

    /* Typing indicator */
    .typing { display: flex; gap: 4px; align-items: center; padding: 14px 16px; }
    .typing span {
      width: 7px; height: 7px; border-radius: 50%;
      background: #f48c06; opacity: 0.6;
      animation: bounce 1.2s ease-in-out infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,60%,100%{transform:translateY(0);} 30%{transform:translateY(-6px);} }

    /* ── Prompt box ── */
    .prompt-wrap {
      padding: 12px 0 8px;
      position: sticky;
      bottom: 0;
    }
    .prompt-box {
      background: rgba(30,18,10,0.96);
      border: 1px solid rgba(232,93,4,0.22);
      border-radius: 20px;
      padding: 8px;
      transition: border-color 0.2s;
    }
    .prompt-box:focus-within { border-color: rgba(232,93,4,0.55); }

    /* Image preview */
    .image-preview-wrap {
      display: none;
      position: relative;
      width: fit-content;
      padding: 4px 4px 2px;
    }
    .image-preview-wrap.visible { display: block; }
    .image-preview-wrap img {
      width: 60px; height: 60px;
      object-fit: cover;
      border-radius: 10px;
      cursor: pointer;
    }
    .remove-img {
      position: absolute; top: 6px; right: 6px;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: rgba(0,0,0,0.7);
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: #fff;
    }
    .remove-img svg { width: 10px; height: 10px; }

    /* Textarea */
    textarea.prompt-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: rgba(255,255,255,0.9);
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      line-height: 1.6;
      resize: none;
      padding: 6px 10px;
      min-height: 44px;
      max-height: 180px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #444 transparent;
    }
    textarea.prompt-input::placeholder { color: rgba(255,255,255,0.3); }

    /* Bottom toolbar */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 2px 4px;
    }
    .tool-btn {
      height: 32px;
      border: none;
      background: transparent;
      cursor: pointer;
      color: rgba(255,255,255,0.45);
      border-radius: 20px;
      display: flex; align-items: center; gap: 5px;
      padding: 0 8px;
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      font-weight: 500;
      transition: background 0.15s, color 0.15s;
    }
    .tool-btn:hover { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.8); }
    .tool-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
    .tool-btn.active { background: rgba(232,93,4,0.15); color: #f48c06; border: 1px solid rgba(232,93,4,0.35); }
    .tool-divider { width: 1px; height: 18px; background: rgba(255,255,255,0.1); margin: 0 2px; flex-shrink: 0; }

    .send-btn {
      margin-left: auto;
      width: 32px; height: 32px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      background: rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.3);
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, color 0.2s, transform 0.15s;
      flex-shrink: 0;
    }
    .send-btn.active { background: #f48c06; color: #fff; }
    .send-btn:active { transform: scale(0.93); }
    .send-btn svg { width: 16px; height: 16px; }

    /* Popover tools menu */
    .tools-menu {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 0;
      background: rgba(20,12,6,0.98);
      border: 1px solid rgba(232,93,4,0.2);
      border-radius: 14px;
      padding: 6px;
      min-width: 220px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.6);
      display: none;
      z-index: 100;
    }
    .tools-menu.open { display: block; }
    .tools-menu-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      color: rgba(255,255,255,0.7);
      transition: background 0.15s, color 0.15s;
      border: none; background: transparent; width: 100%;
      font-family: 'Montserrat', sans-serif;
      text-align: left;
    }
    .tools-menu-item:hover { background: rgba(232,93,4,0.1); color: #f48c06; }
    .tools-menu-item svg { width: 16px; height: 16px; flex-shrink: 0; }
    .tools-menu-item .extra { margin-left: auto; font-size: 11px; color: rgba(255,255,255,0.3); }

    /* Active tool chip */
    .active-tool-chip {
      display: none;
      align-items: center; gap: 5px;
      height: 28px;
      padding: 0 10px;
      border-radius: 20px;
      font-size: 12px; font-weight: 500;
      color: #f48c06;
      background: rgba(232,93,4,0.12);
      border: 1px solid rgba(232,93,4,0.3);
      cursor: pointer;
      transition: background 0.15s;
    }
    .active-tool-chip.visible { display: flex; }
    .active-tool-chip:hover { background: rgba(232,93,4,0.2); }
    .active-tool-chip svg { width: 12px; height: 12px; }

    /* Image lightbox */
    .lightbox {
      display: none;
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(6px);
      align-items: center; justify-content: center;
    }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 90vw; max-height: 85vh; border-radius: 16px; object-fit: contain; }
    .lightbox-close {
      position: absolute; top: 20px; right: 20px;
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(255,255,255,0.1);
      border: none; cursor: pointer; color: #fff;
      display: flex; align-items: center; justify-content: center;
    }
    .lightbox-close svg { width: 18px; height: 18px; }

    /* Suggestion chips */
    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 8px;
    }
    .chip {
      padding: 7px 14px;
      border-radius: 20px;
      border: 1px solid rgba(232,93,4,0.22);
      background: rgba(232,93,4,0.06);
      color: rgba(255,255,255,0.6);
      font-size: 12px; font-weight: 500;
      cursor: pointer;
      font-family: 'Montserrat', sans-serif;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .chip:hover { background: rgba(232,93,4,0.14); color: #f48c06; border-color: rgba(232,93,4,0.45); }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <a href="index.html" class="logo">
      <img src="brand_assets/logo.png" alt="Tester.io logo" />
      <span>Tester.io</span>
    </a>
    <a href="index.html" class="back-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Back to site
    </a>
  </header>

  <!-- Chat -->
  <div class="chat-wrap">
    <div class="messages" id="messages">
      <div class="empty-state" id="emptyState">
        <div class="flame">🔥</div>
        <h2>Tester.io AI Assistant</h2>
        <p>Ask me anything about QA, test automation, or how Tester.io can help your team ship with confidence.</p>
        <div class="suggestions">
          <button class="chip" onclick="fillPrompt('How do I set up automated testing?')">How do I set up automated testing?</button>
          <button class="chip" onclick="fillPrompt('What is regression testing?')">What is regression testing?</button>
          <button class="chip" onclick="fillPrompt('How does CI/CD integration work?')">How does CI/CD integration work?</button>
          <button class="chip" onclick="fillPrompt('Compare free vs pro plan')">Compare free vs pro plan</button>
        </div>
      </div>
    </div>

    <!-- Prompt input -->
    <div class="prompt-wrap">
      <div class="prompt-box" id="promptBox">
        <!-- Image preview -->
        <div class="image-preview-wrap" id="imgPreviewWrap">
          <img id="imgPreview" src="" alt="preview" onclick="openLightbox(this.src)" />
          <button class="remove-img" onclick="removeImage()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>

        <textarea class="prompt-input" id="promptInput" placeholder="Message Tester AI..." rows="1"></textarea>

        <!-- Toolbar -->
        <div class="toolbar" style="position:relative">
          <!-- Attach -->
          <button class="tool-btn" title="Attach image" onclick="document.getElementById('fileInput').click()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <input type="file" id="fileInput" accept="image/*" class="hidden" style="display:none" onchange="handleFile(this)" />

          <!-- Tools popover trigger -->
          <div style="position:relative">
            <button class="tool-btn" id="toolsBtn" onclick="toggleToolsMenu()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg>
              Tools
            </button>
            <!-- Tools menu -->
            <div class="tools-menu" id="toolsMenu">
              <button class="tools-menu-item" onclick="selectTool('createImage','🎨','Image')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                Create an image
              </button>
              <button class="tools-menu-item" onclick="selectTool('searchWeb','🌐','Search')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>
                Search the web
              </button>
              <button class="tools-menu-item" onclick="selectTool('writeCode','✏️','Write')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 114 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
                Write or code
              </button>
              <button class="tools-menu-item" onclick="selectTool('deepResearch','🔭','Deep Search')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                Run deep research
                <span class="extra">5 left</span>
              </button>
              <button class="tools-menu-item" onclick="selectTool('thinkLonger','💡','Think')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7C9.24 7 7 9.24 7 12c0 1.36.54 2.6 1.43 3.5.34.35.63.77.72 1.25l.53 2.64A1.75 1.75 0 0011.64 21h.72a1.75 1.75 0 001.72-1.61l.53-2.64c.1-.48.38-.9.72-1.25C16.46 14.6 17 13.36 17 12c0-2.76-2.24-5-5-5z"/></svg>
                Think for longer
              </button>
            </div>
          </div>

          <!-- Active tool chip -->
          <button class="active-tool-chip" id="activeToolChip" onclick="clearTool()">
            <span id="activeToolLabel">Tool</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>

          <!-- Mic + Send -->
          <button class="tool-btn" title="Voice input" onclick="handleMic()" id="micBtn" style="margin-left:auto">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
          </button>
          <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="Send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <button class="lightbox-close" onclick="closeLightbox()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <img id="lightboxImg" src="" alt="full preview" onclick="event.stopPropagation()" />
  </div>

  <script>
    const input = document.getElementById('promptInput');
    const sendBtn = document.getElementById('sendBtn');
    const messages = document.getElementById('messages');
    const emptyState = document.getElementById('emptyState');
    const toolsMenu = document.getElementById('toolsMenu');
    const activeChip = document.getElementById('activeToolChip');
    const activeLabel = document.getElementById('activeToolLabel');
    let activeTool = null;
    let imageFile = null;
    let isTyping = false;

    // Auto-resize textarea
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 180) + 'px';
      updateSendBtn();
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    function updateSendBtn() {
      const hasContent = input.value.trim() || imageFile;
      sendBtn.classList.toggle('active', !!hasContent);
    }

    // Tools
    function toggleToolsMenu() {
      toolsMenu.classList.toggle('open');
    }
    document.addEventListener('click', (e) => {
      if (!document.getElementById('toolsBtn').contains(e.target) && !toolsMenu.contains(e.target)) {
        toolsMenu.classList.remove('open');
      }
    });
    function selectTool(id, emoji, label) {
      activeTool = { id, emoji, label };
      activeLabel.textContent = emoji + ' ' + label;
      activeChip.classList.add('visible');
      toolsMenu.classList.remove('open');
      const placeholder = { createImage: 'Describe what you want to create...', searchWeb: 'Search the web...', writeCode: 'What would you like to write or code?', deepResearch: 'What should I research?', thinkLonger: 'Think deeply about...' };
      input.placeholder = placeholder[id] || 'Message Tester AI...';
    }
    function clearTool() {
      activeTool = null;
      activeChip.classList.remove('visible');
      input.placeholder = 'Message Tester AI...';
    }

    // File upload
    function handleFile(fileInput) {
      const file = fileInput.files[0];
      if (!file || !file.type.startsWith('image/')) return;
      imageFile = file;
      const reader = new FileReader();
      reader.onload = (e) => {
        document.getElementById('imgPreview').src = e.target.result;
        document.getElementById('imgPreviewWrap').classList.add('visible');
      };
      reader.readAsDataURL(file);
      updateSendBtn();
    }
    function removeImage() {
      imageFile = null;
      document.getElementById('imgPreviewWrap').classList.remove('visible');
      document.getElementById('imgPreview').src = '';
      document.getElementById('fileInput').value = '';
      updateSendBtn();
    }

    // Lightbox
    function openLightbox(src) {
      document.getElementById('lightboxImg').src = src;
      document.getElementById('lightbox').classList.add('open');
    }
    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
    }

    // Fill prompt from suggestion chips
    function fillPrompt(text) {
      input.value = text;
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 180) + 'px';
      input.focus();
      updateSendBtn();
    }

    // Mic (placeholder)
    function handleMic() {
      input.focus();
      input.placeholder = '🎙 Listening...';
      setTimeout(() => { input.placeholder = 'Message Tester AI...'; }, 2000);
    }

    // Send
    function sendMessage() {
      const text = input.value.trim();
      const imgSrc = document.getElementById('imgPreview').src;
      if (!text && !imageFile) return;

      hideEmpty();

      // User bubble
      const userDiv = document.createElement('div');
      userDiv.className = 'msg user';
      let bubbleContent = '';
      if (imgSrc && imageFile) {
        bubbleContent += `<img src="${imgSrc}" style="max-width:200px;border-radius:10px;margin-bottom:6px;display:block;cursor:pointer" onclick="openLightbox('${imgSrc}')" />`;
      }
      if (text) bubbleContent += `<span>${escHtml(text)}</span>`;
      userDiv.innerHTML = `
        <div class="msg-avatar">U</div>
        <div class="msg-bubble">${bubbleContent}</div>
      `;
      messages.appendChild(userDiv);

      // Reset
      input.value = '';
      input.style.height = 'auto';
      removeImage();
      updateSendBtn();
      scrollBottom();

      // AI typing
      showTyping();
      setTimeout(() => {
        removeTyping();
        addAIMessage(getReply(text));
        scrollBottom();
      }, 1200 + Math.random() * 800);
    }

    function hideEmpty() {
      if (emptyState) emptyState.style.display = 'none';
    }
    function scrollBottom() {
      messages.scrollTop = messages.scrollHeight;
    }
    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    let typingEl = null;
    function showTyping() {
      typingEl = document.createElement('div');
      typingEl.className = 'msg ai';
      typingEl.id = 'typingIndicator';
      typingEl.innerHTML = `
        <div class="msg-avatar">🔥</div>
        <div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>
      `;
      messages.appendChild(typingEl);
      scrollBottom();
    }
    function removeTyping() {
      if (typingEl) { typingEl.remove(); typingEl = null; }
    }
    function addAIMessage(text) {
      const el = document.createElement('div');
      el.className = 'msg ai';
      el.innerHTML = `<div class="msg-avatar">🔥</div><div class="msg-bubble">${text}</div>`;
      messages.appendChild(el);
    }

    // Simple canned replies for demo
    function getReply(text) {
      const t = text.toLowerCase();
      if (t.includes('automat')) return "Tester.io supports full automation pipelines — you can connect your test suite via our CI/CD integration and trigger runs on every commit. Would you like a quick setup guide?";
      if (t.includes('regression')) return "Regression testing ensures that new code changes don't break existing functionality. Tester.io lets you build structured regression suites and run them automatically on each deployment.";
      if (t.includes('ci') || t.includes('cd') || t.includes('pipeline')) return "Tester.io integrates with GitHub Actions, GitLab CI, Jenkins, and more. Just add our webhook to your pipeline and test results will appear in your dashboard in real time.";
      if (t.includes('plan') || t.includes('price') || t.includes('free') || t.includes('pro')) return "Our <strong>Free plan</strong> covers individuals and small teams. <strong>Pro</strong> unlocks advanced reporting, unlimited test cases, and priority support. <strong>Enterprise</strong> is fully custom — reach out for a quote!";
      if (t.includes('hello') || t.includes('hi') || t.includes('hey')) return "Hey there! 👋 I'm the Tester.io AI assistant. Ask me anything about QA, automation, or how to get started.";
      return "Great question! The Tester.io platform is built to help engineering teams plan, execute, and track QA — from manual checklists to full automation pipelines. What specific aspect can I help you with?";
    }
  </script>

</body>
